[project]
name = "langch-backend"
version = "0.1.0"
description = "FastAPI backend for LangChain Managed Deep Agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.1.0",
    "deepagents>=0.3.0",
    "langgraph>=0.4.0",
    "langgraph-sdk>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
]

[project.scripts]
provision-agent = "scripts.provision_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
